[project]
name = "decider"
version = "0.1.0"
description = "Local GLiNER2 decision server for the Omacode plugins: guards, decisions and names, on the CPU"
requires-python = ">=3.12"
dependencies = [
    # gliner2 2.1 and transformers 5: the decider's successor (container plan P6), gliner-guard-uniencoder tuned in
    # train/, names its tokenizer TokenizersBackend, which transformers 4 cannot load. Pinned to releases older than two
    # weeks (2026-11-21).
    "gliner2[local]==2.1.0",
    "transformers==5.22.0",
    "protobuf>=5",
    "sentencepiece>=0.2",
    "torch>=2.6",
]

[project.scripts]
decider = "decider.server:main"

# CPU-only torch: the 4060 stays free for llama-swap and the NPU for Whisper.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decider"]
